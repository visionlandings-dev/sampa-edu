<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Obrigado — Sampa Educacional</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230A192F'/><text y='24' x='6' font-size='22' font-family='sans-serif' font-weight='bold' fill='%23D4AF37'>S</text></svg>"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0A192F; color: #fff;
      font-family: system-ui, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
    }
    .box { max-width: 520px; }
    .check { font-size: 3rem; margin-bottom: 1.5rem; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.1; margin-bottom: 1rem; }
    p { color: #A0AEC0; line-height: 1.6; margin-bottom: 2rem; }
    a {
      display: inline-block; background: #D4AF37; color: #0A192F;
      font-weight: 700; padding: .75rem 2rem; border-radius: 6px;
      text-decoration: none; font-size: .95rem;
    }
    a:hover { background: #C5A059; }
  </style>
</head>
<body>
  <div class="box">
    <div class="check">✅</div>
    <h1>Você está na Lista VIP.</h1>
    <p>Nossa equipe analisará sua solicitação e entrará em contato em até <strong style="color:#fff">1 dia útil</strong> pelo WhatsApp ou e-mail informado.</p>
    <a href="/">Voltar ao início</a>
  </div>
</body>
</html>
